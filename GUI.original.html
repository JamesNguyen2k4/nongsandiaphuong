    };
    let backendRecords=[], ready=false, initialTimer, cart={}, activeProduct=null, searchTerm="", selectedCategory="all";
    function toast(message){const el=$("toast");el.textContent=message;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,4000)}
    function products(){return [...sampleProducts,...backendRecords.filter(r=>r.record_type==="product" && r.product_visible!==false).map(r=>({id:r.__backendId,name:r.product_name||"Sản phẩm",category:r.product_category||"Sản phẩm",group:"other",price:Number(r.product_sale_price)>0?Number(r.product_sale_price):Number(r.product_price)||0,description:r.product_short_desc||"",features:r.product_full_desc||"Thông tin cần xác nhận với cửa hàng.",ingredients:r.product_ingredients||"Chưa cung cấp.",pack:r.product_packaging||"Chưa cung cấp.",usage:r.product_usage||"Chưa cung cấp.",origin:r.product_origin||"Chưa cung cấp."}))]}
    function findProduct(id){return products().find(p=>p.id===id)}
    function productImage(id){return document.querySelector('.product-card[data-id="'+id+'"] img')?.getAttribute("src")||null}
    function showView(name){document.querySelectorAll("main > .view, main > section.view").forEach(el=>el.hidden=el.id!==name+"-view");window.scrollTo({top:0,behavior:"smooth"});if(name==="cart")renderCart();if(name==="checkout")renderCheckout();if(name==="home")filterProducts()}
    function addToCart(id,count=1){const p=findProduct(id);if(!p)return;cart[id]=Math.min(99,(cart[id]||0)+count);renderCount();toast("Đã thêm vào giỏ hàng.")}
    function renderCount(){$("cart-count").textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
    function cartEntries(){return Object.entries(cart).map(([id,quantity])=>({product:findProduct(id),quantity})).filter(x=>x.product)}
    function cartTotal(){return cartEntries().reduce((sum,x)=>sum+x.product.price*x.quantity,0)}
    function filterProducts(){let visible=0;document.querySelectorAll(".product-card").forEach(card=>{const p=findProduct(card.dataset.id);const match=!!p&&p.name.toLocaleLowerCase("vi").includes(searchTerm)&& (selectedCategory==="all"||p.group===selectedCategory);card.hidden=!match;if(match)visible++});$("empty-search").hidden=visible!==0;$("search-status").hidden=!searchTerm;$("search-status").textContent=searchTerm?'Kết quả tìm kiếm cho: “'+$("search").value.trim()+'”':'';document.querySelectorAll("#category-bar button").forEach(b=>b.classList.toggle("active",b.dataset.category===selectedCategory))}
    function renderExtras(){
      const box=$("extra-products");box.replaceChildren();
      backendRecords.filter(r=>r.record_type==="product"&&r.product_visible!==false).forEach(r=>{
        if(box.querySelector('[data-record-id="'+r.__backendId+'"]'))return;
        const p=findProduct(r.__backendId);if(!p)return;
        const card=document.createElement("article");card.className="card p-5";card.dataset.recordId=p.id;
        const badge=document.createElement("p");badge.className="text-xs text-[#648047] font-bold mb-3";badge.textContent="Sản phẩm được thêm vào gian hàng · chưa có ảnh";
        const h=document.createElement("h3");h.className="mb-2";h.textContent=p.name;
        const desc=document.createElement("p");desc.className="muted mb-3";desc.textContent=p.description;
        const price=document.createElement("p");price.className="font-bold text-[#174d37] mb-4";price.textContent=money(p.price)+" · giá cần xác nhận";
        const btn=document.createElement("button");btn.type="button";btn.className="outline";btn.textContent="Xem chi tiết";btn.onclick=()=>openDetail(p.id);
        card.append(badge,h,desc,price,btn);box.append(card);
      });
    }
    function openDetail(id){const p=findProduct(id);if(!p)return;activeProduct=id;$("detail-name").textContent=p.name;$("detail-category").textContent=p.category;$("detail-price").textContent=money(p.price);$("detail-description").textContent=p.description;$("detail-origin").textContent=p.origin||"Nguồn gốc cụ thể cần xác nhận với cửa hàng; sản phẩm được giới thiệu trong gian hàng Yên Bình Market.";$("detail-features").textContent=p.features;$("detail-ingredients").textContent=p.ingredients;$("detail-pack").textContent=p.pack;$("detail-usage").textContent=p.usage;$("detail-quantity").value=1;
      const photo=$("detail-photo");photo.replaceChildren();const src=productImage(id);if(src){const img=document.createElement("img");img.src=src;img.alt=p.name;img.className="w-full h-72 md:h-[460px] object-cover";photo.append(img)}else{photo.className="rounded-2xl bg-[#edf2e8] min-h-64 flex items-center justify-center p-6 muted";photo.textContent="Chưa có ảnh sản phẩm";}
      const related=$("related-items");related.replaceChildren();products().filter(x=>x.id!==id).slice(0,3).forEach(x=>{const b=document.createElement("button");b.type="button";b.className="outline text-left";b.textContent=x.name;b.onclick=()=>openDetail(x.id);related.append(b)});showView("detail")}
    function quantity(){const input=$("detail-quantity");if(!input.reportValidity())return null;const n=Number(input.value);if(!Number.isInteger(n)||n<1||n>99){toast("Vui lòng chọn từ 1 đến 99 sản phẩm.");return null}return n}
    function renderCart(){const box=$("cart-items");box.replaceChildren();const entries=cartEntries();if(!entries.length){const p=document.createElement("p");p.className="bg-white border rounded-2xl p-8 muted";p.textContent="Giỏ hàng đang trống. Hãy khám phá sản phẩm trước nhé.";box.append(p)}
      entries.forEach(({product:p,quantity:q})=>{const row=document.createElement("article");row.className="bg-white border rounded-2xl p-4 flex flex-wrap sm:flex-nowrap gap-4 items-center";const src=productImage(p.id);if(src){const img=document.createElement("img");img.src=src;img.alt=p.name;img.className="w-24 h-24 rounded-xl object-cover";row.append(img)}
        const body=document.createElement("div");body.className="flex-1 min-w-48";const h=document.createElement("h2");h.className="font-bold mb-1";h.textContent=p.name;const price=document.createElement("p");price.className="text-[#174d37] font-bold mb-2";price.textContent=money(p.price);
        const controls=document.createElement("div");controls.className="qty";const minus=document.createElement("button");minus.type="button";minus.textContent="−";minus.setAttribute("aria-label","Giảm số lượng "+p.name);minus.onclick=()=>{if(cart[p.id]<=1)delete cart[p.id];else cart[p.id]--;renderCount();renderCart()};const num=document.createElement("span");num.textContent=q;const plus=document.createElement("button");plus.type="button";plus.textContent="+";plus.setAttribute("aria-label","Tăng số lượng "+p.name);plus.onclick=()=>{cart[p.id]=Math.min(99,cart[p.id]+1);renderCount();renderCart()};controls.append(minus,num,plus);
        const del=document.createElement("button");del.type="button";del.className="text-red-700 underline text-sm mt-2";del.textContent="Xóa sản phẩm";del.onclick=()=>{delete cart[p.id];renderCount();renderCart()};body.append(h,price,controls,del);row.append(body);box.append(row)});
      $("cart-total").textContent="Tổng tiền mẫu: "+money(cartTotal());$("checkout-button").disabled=!entries.length}
    function renderCheckout(){const box=$("checkout-items");box.replaceChildren();cartEntries().forEach(({product:p,quantity:q})=>{const line=document.createElement("p");line.className="flex justify-between gap-3 text-sm";const name=document.createElement("span");name.textContent=p.name+" × "+q;const amount=document.createElement("strong");amount.className="whitespace-nowrap";amount.textContent=money(p.price*q);line.append(name,amount);box.append(line)});$("checkout-total").textContent="Tổng tiền mẫu: "+money(cartTotal())}
    const handler={onDataChanged(data){clearTimeout(initialTimer);ready=true;backendRecords=data;$("manage-status").textContent="Đã kết nối Canva Sheet. Chỉ thêm sản phẩm nếu bạn được phép quản lý gian hàng.";renderExtras()}};
    async function initData(){ready=false;clearTimeout(initialTimer);initialTimer=setTimeout(()=>{if(!ready){$("manage-status").textContent="Không tải được dữ liệu. Nhấn vào đây để thử lại.";$("manage-status").style.cursor="pointer";$("manage-status").onclick=initData}},8000);try{const result=await window.dataSdk.init(handler);if(!result.isOk)throw Error("init")}catch{clearTimeout(initialTimer);$("manage-status").textContent="Không kết nối được Canva Sheet. Nhấn vào đây để thử lại.";$("manage-status").style.cursor="pointer";$("manage-status").onclick=initData}}
    function status(message,error=false){const el=$("order-status");el.hidden=false;el.textContent=message;el.className="text-sm "+(error?"text-red-700":"text-[#174d37]")}
    document.addEventListener("DOMContentLoaded",()=>{
      if(window.lucide)lucide.createIcons();
      initData();
      document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>showView(b.dataset.go==="products"?"home":b.dataset.go)));
      document.querySelectorAll('[data-go="products"]').forEach(b=>b.addEventListener("click",()=>setTimeout(()=>document.querySelector("#product-grid").scrollIntoView({behavior:"smooth",block:"start"}),40)));
      document.querySelectorAll("[data-detail]").forEach(b=>b.addEventListener("click",()=>openDetail(b.dataset.detail)));
      document.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>addToCart(b.dataset.add)));
      document.querySelectorAll("#category-bar button").forEach(b=>b.onclick=()=>{selectedCategory=b.dataset.category;filterProducts()});
      $("search-form").addEventListener("submit",e=>{e.preventDefault();searchTerm=$("search").value.trim().toLocaleLowerCase("vi");selectedCategory="all";showView("home");setTimeout(()=>document.querySelector("#product-grid").scrollIntoView({behavior:"smooth",block:"start"}),40)});
      $("search").addEventListener("input",()=>{searchTerm=$("search").value.trim().toLocaleLowerCase("vi");filterProducts()});
      $("detail-add").onclick=()=>{const n=quantity();if(n)addToCart(activeProduct,n)};
      $("detail-buy").onclick=()=>{const n=quantity();if(n){addToCart(activeProduct,n);showView("cart")}};
      $("checkout-button").onclick=()=>{if(cartEntries().length)showView("checkout")};
      $("account-button").onclick=()=>toast("Tài khoản khách hàng chưa được hỗ trợ trên gian hàng này.");
      document.querySelectorAll("[data-policy]").forEach(b=>b.onclick=()=>{const [title,copy]=policies[b.dataset.policy];$("policy-title").textContent=title;$("policy-copy").textContent=copy;showView("policy")});
      $("order-form").addEventListener("submit",async e=>{
        e.preventDefault();if(!$("order-form").reportValidity())return;
        if(!ready){status("Chưa kết nối Canva Sheet. Vui lòng thử lại sau.",true);return}
        const items=cartEntries();if(!items.length){status("Giỏ hàng đang trống.",true);return}
        if(backendRecords.length>=999){status("Gian hàng đã đạt giới hạn bản ghi. Vui lòng liên hệ cửa hàng.",true);return}
        const button=e.submitter||$("order-submit");button.disabled=true;status("Đang gửi yêu cầu đặt hàng…");
        const code="YB-"+Date.now().toString(36).toUpperCase();
        const record={record_type:"order",order_customer_name:$("customer-name").value.trim(),order_phone:$("customer-phone").value.trim(),order_address:$("customer-address").value.trim(),order_note:$("customer-note").value.trim(),order_payment_method:document.querySelector('input[name="payment"]:checked').value,order_items_json:JSON.stringify(items.map(x=>({product_id:x.product.id,name:x.product.name,quantity:x.quantity,sample_unit_price:x.product.price}))),order_total:cartTotal(),order_status:"Yêu cầu mới - chờ xác nhận",order_code:code,created_at:new Date().toISOString()};
        try{const result=await window.dataSdk.create(record);if(!result.isOk){status("Không thể xác nhận yêu cầu đã được lưu. Vui lòng kiểm tra trước khi gửi lại.",true);return}cart={};renderCount();$("order-form").reset();$("order-status").hidden=true;$("success-code").textContent="Mã yêu cầu: "+code;showView("success")}
        catch{status("Không thể xác nhận yêu cầu đã được lưu. Vui lòng kiểm tra trước khi gửi lại.",true)}
        finally{button.disabled=false}
      });
      $("product-form").addEventListener("submit",async e=>{
        e.preventDefault();if(!$("product-form").reportValidity())return;
        if(!ready){$("manage-status").textContent="Chưa kết nối Canva Sheet.";return}
        if(backendRecords.length>=999){$("manage-status").textContent="Đã đạt giới hạn 999 bản ghi.";return}
        const button=e.submitter||$("product-submit");button.disabled=true;
        const record={record_type:"product",product_name:$("p-name").value.trim(),product_category:$("p-category").value.trim(),product_price:Number($("p-price").value),product_sale_price:0,product_stock:0,product_short_desc:$("p-description").value.trim(),product_full_desc:$("p-description").value.trim(),product_origin:"",product_ingredients:"",product_usage:"",product_packaging:"",product_image_1:"",product_image_2:"",product_image_3:"",product_image_4:"",product_visible:true,product_sold_count:0,product_rating:0,product_rating_count:0,product_featured:false,created_at:new Date().toISOString()};
        try{const result=await window.dataSdk.create(record);if(!result.isOk){$("manage-status").textContent="Không thể xác nhận việc lưu. Hãy kiểm tra trước khi thử lại.";return}$("product-form").reset();$("manage-status").textContent="Đã lưu thông tin sản phẩm vào Canva Sheet. Sản phẩm chưa có ảnh."}
        catch{$("manage-status").textContent="Không thể xác nhận việc lưu. Hãy kiểm tra trước khi thử lại."}
        finally{button.disabled=false}
      });
    });
  </script>
 </body>
</html>
